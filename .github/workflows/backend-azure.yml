name: Deploy backend to Azure

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/backend-azure.yml
      - .github/workflows/backend-ci.yml
  workflow_dispatch:
    inputs:
      action:
        description: Deploy current main, redeploy its recorded image, or roll back
        required: true
        type: choice
        options: [deploy, redeploy, rollback]
      commit_sha:
        description: Full SHA to deploy (must equal current main)
        required: false
        type: string
      release_run_id:
        description: Successful release run ID for redeploy or rollback
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: backend-azure-main
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      action: ${{ steps.commit.outputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          REQUESTED_ACTION: ${{ inputs.action }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          action="${REQUESTED_ACTION:-deploy}"
          [[ "$action" == deploy || "$action" == redeploy || "$action" == rollback ]] || exit 1
          if [[ "$action" == deploy || "$action" == redeploy ]]; then
            if [[ "$action" == deploy ]]; then
              [[ -z "$RELEASE_RUN_ID" ]] || exit 1
            else
              [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            fi
            sha="${REQUESTED_SHA:-$GITHUB_SHA}"
            [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
            git cat-file -e "$sha^{commit}"
            git merge-base --is-ancestor "$sha" refs/remotes/origin/main
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            [[ -z "$REQUESTED_SHA" && "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"

  ci:
    if: needs.resolve.outputs.action != 'rollback'
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/backend-ci.yml
    with:
      commit_sha: ${{ needs.resolve.outputs.sha }}

  deploy:
    if: always() && needs.resolve.result == 'success' && (needs.ci.result == 'success' || (needs.resolve.outputs.action == 'rollback' && needs.ci.result == 'skipped'))
    needs: [resolve, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      ACR_NAME: ${{ vars.BACKEND_ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.BACKEND_RESOURCE_GROUP }}
      WEBAPP_NAME: ${{ vars.BACKEND_WEBAPP_NAME }}
      BASE_URL: ${{ vars.BACKEND_BASE_URL }}
      IMAGE_REPOSITORY: dreamplanner-backend
      COMMIT_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_ACTION: ${{ needs.resolve.outputs.action }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check configuration
        shell: bash
        run: |
          set -euo pipefail
          for value in "$ACR_NAME" "$RESOURCE_GROUP" "$WEBAPP_NAME" "$BASE_URL"; do
            [[ -n "$value" ]] || { echo 'Missing backend deployment variable'; exit 1; }
          done
          [[ "$BASE_URL" == https://* ]] || { echo 'HTTPS base URL required'; exit 1; }
      - uses: actions/download-artifact@v4
        if: needs.resolve.outputs.action == 'deploy'
        with:
          name: backend-image
          path: ${{ runner.temp }}/backend-image
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify recorded rollback release
        id: rollback
        if: needs.resolve.outputs.action != 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
          jq -e '.path == ".github/workflows/backend-azure.yml" and .head_branch == "main" and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch")' <<< "$run" > /dev/null
          attempt="$(jq -r '.run_attempt' <<< "$run")"
          name="backend-release-$attempt"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/artifacts" --paginate |
            jq -e --arg name "$name" '.artifacts[] | select(.name == $name and .expired == false)' > /dev/null
          echo "artifact_name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: needs.resolve.outputs.action != 'deploy'
        with:
          name: ${{ steps.rollback.outputs.artifact_name }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/backend-release
      - name: Authenticate using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.BACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.BACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.BACKEND_AZURE_SUBSCRIPTION_ID }}
      - name: Check existing container configuration and record previous image
        shell: bash
        run: |
          set -euo pipefail
          config="$(az webapp config show --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME" --query '{image:linuxFxVersion,acr:acrUseManagedIdentityCreds,identity:acrUserManagedIdentityID}' -o json)"
          [[ "$(jq -r '.acr' <<< "$config")" == true ]] || { echo 'ACR managed identity pull is not enabled'; exit 1; }
          previous="$(jq -r '.image' <<< "$config")"
          [[ "$previous" == DOCKER\|* ]] || { echo 'Existing app is not a Docker container'; exit 1; }
          echo "Previous image: ${previous#DOCKER|}" >> "$GITHUB_STEP_SUMMARY"
          echo "acr_identity=$(jq -r '.identity // ""' <<< "$config")" >> "$GITHUB_ENV"
      - name: Load, push and verify image digest
        if: needs.resolve.outputs.action == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          image="$ACR_NAME.azurecr.io/$IMAGE_REPOSITORY:$COMMIT_SHA"
          az acr login --name "$ACR_NAME"
          if az acr repository show --name "$ACR_NAME" --image "$IMAGE_REPOSITORY:$COMMIT_SHA" --output none 2>/dev/null; then
            echo 'Commit tag already exists; refusing replacement'
            exit 1
          fi
          docker load -i "$RUNNER_TEMP/backend-image/backend-image.tar"
          expected_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          actual_id="$(docker image inspect dreamplanner-backend:ci --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^RELEASE_ID=//p')"
          [[ "$actual_id" == "$expected_id" ]] || { echo 'CI artifact release ID mismatch'; exit 1; }
          docker tag dreamplanner-backend:ci "$image"
          docker push "$image" | tee "$RUNNER_TEMP/docker-push.log"
          pushed="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$RUNNER_TEMP/docker-push.log" | tail -1)"
          [[ "$pushed" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          registered="$(az acr repository show --name "$ACR_NAME" --image "$IMAGE_REPOSITORY:$COMMIT_SHA" --query digest -o tsv)"
          [[ "$registered" == "$pushed" ]] || { echo 'ACR digest mismatch'; exit 1; }
          {
            echo "target_image=$ACR_NAME.azurecr.io/$IMAGE_REPOSITORY@$pushed"
            echo "target_digest=$pushed"
            echo "target_sha=$COMMIT_SHA"
            echo "expected_release_id=$expected_id"
          } >> "$GITHUB_ENV"
      - name: Verify rollback record and digest
        if: needs.resolve.outputs.action != 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          record="$RUNNER_TEMP/backend-release/release.json"
          jq -e --argjson run "$RELEASE_RUN_ID" --arg registry "$ACR_NAME" --arg repo "$IMAGE_REPOSITORY" '
            .run_id == $run and
            (.release_id | type == "string" and test("^[0-9]+-[0-9]+$")) and
            (.source_sha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
            .image == ($registry + ".azurecr.io/" + $repo + "@" + .digest)
          ' "$record" > /dev/null
          sha="$(jq -r '.source_sha' "$record")"
          git cat-file -e "$sha^{commit}"
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          if [[ "$RELEASE_ACTION" == redeploy ]]; then
            [[ "$sha" == "$COMMIT_SHA" ]] || { echo 'Redeploy record must belong to current main'; exit 1; }
          fi
          digest="$(jq -r '.digest' "$record")"
          az acr repository show --name "$ACR_NAME" --image "$IMAGE_REPOSITORY@$digest" --output none
          {
            echo "target_image=$(jq -r '.image' "$record")"
            echo "target_digest=$digest"
            echo "target_sha=$sha"
            echo "expected_release_id=$(jq -r '.release_id' "$record")"
          } >> "$GITHUB_ENV"
      - name: Deploy verified image
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_ACTION" != rollback ]]; then
            git fetch --no-tags origin main
            [[ "$(git rev-parse refs/remotes/origin/main)" == "$COMMIT_SHA" ]] || {
              echo 'Newer main commit exists; refusing stale deployment'
              exit 1
            }
          fi
          az webapp config container set --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME" --container-image-name "$target_image" --output none
          config="$(az webapp config show --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME" --query '{image:linuxFxVersion,acr:acrUseManagedIdentityCreds,identity:acrUserManagedIdentityID}' -o json)"
          [[ "$(jq -r '.acr' <<< "$config")" == true ]] || exit 1
          [[ "$(jq -r '.identity // ""' <<< "$config")" == "$acr_identity" ]] || exit 1
          [[ "$(jq -r '.image' <<< "$config")" == "DOCKER|$target_image" ]] || exit 1
          echo "Configured image: $target_image" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test the requested release
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE_URL%/}"
          for path in /api/v1/health /api/v1/health/ready; do
            ok=false
            for attempt in {1..12}; do
              code="$(curl --silent --show-error --output /dev/null --dump-header "$RUNNER_TEMP/headers" --connect-timeout 5 --max-time 15 --write-out '%{http_code}' -H 'Cache-Control: no-cache' "$base$path")" || code=000
              observed="$(sed -nE 's/^[Xx]-[Rr]elease-[Ii]d:[[:space:]]*([^[:space:]\r]+).*/\1/p' "$RUNNER_TEMP/headers" | tail -1)"
              if [[ "$code" == 200 && "$observed" == "$expected_release_id" ]]; then ok=true; break; fi
              sleep 10
            done
            [[ "$ok" == true ]] || { echo "Smoke test failed after $attempt attempts: $path did not serve release $expected_release_id"; exit 1; }
            echo "Smoke test passed for $path on release $expected_release_id" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Record successful release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/backend-release"
          jq -n --argjson run "$GITHUB_RUN_ID" --arg id "$expected_release_id" --arg sha "$target_sha" --arg digest "$target_digest" --arg image "$target_image" '{run_id:$run,release_id:$id,source_sha:$sha,digest:$digest,image:$image}' > "$RUNNER_TEMP/backend-release/release.json"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-release/release.json
          if-no-files-found: error
          retention-days: 90
